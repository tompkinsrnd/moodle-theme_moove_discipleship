name: Build and push theme image

on:
  push:
    branches: [discipleship/5.1]

env:
  REGISTRY: harbor.ops.tompkinsrnd.com
  IMAGE: tompkinsrnd/moodle-theme-moove
  GITOPS_REPO: tompkinsrnd/snec-gitops-argocd
  DEPLOY_FILE: apps/snec-moodle/deployment-moodle.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Generate date tag
        id: tag
        run: echo "date=$(date -u +'%Y%m%d.%H%M%S')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.date }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update gitops repo with new image tag
        env:
          TAG: ${{ steps.tag.outputs.date }}
          SSH_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$SSH_KEY" | ssh-add -
          mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts

          git clone --depth 1 git@github.com:${GITOPS_REPO}.git /tmp/gitops
          cd /tmp/gitops
          sed -i "s|image: ${REGISTRY}/${IMAGE}:.*|image: ${REGISTRY}/${IMAGE}:${TAG}|" "${DEPLOY_FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${DEPLOY_FILE}"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update theme image to ${TAG}"
          git push
